name: zh-Hant build (no Xcode needed locally)
on:
  workflow_dispatch:
  push:
    branches: [zh-hant]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode.app
      - name: Build (ad-hoc signed)
        run: |
          xcodebuild -project boringNotch.xcodeproj -scheme boringNotch \
            -configuration Release -derivedDataPath build \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM="" \
            build | tail -20
      - name: Zip app
        run: cd build/Build/Products/Release && ditto -c -k --keepParent *.app ../../../../BoringNotch-zh-Hant.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BoringNotch-zh-Hant
          path: BoringNotch-zh-Hant.zip
